[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="edufsm"
version="0.1.0.dev0"
description="Educational finite state machine toolkit"
requires-python=">=3.10"
license="MIT"

[project.scripts]
edufsm="edufsm.cli:main"

[tool.setuptools]
packages=["edufsm"]
