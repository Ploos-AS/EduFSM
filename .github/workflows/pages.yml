name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install site toolchain
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build HTML site
        run: make html
      - name: Add language landing page
        run: |
          cat > build/site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduFSM</title></head>
          <body>
            <main>
              <h1>EduFSM</h1>
              <p>Learn how computers make decisions over time.</p>
              <nav>
                <a href="no/">Norsk</a>
                <a href="en/">English</a>
              </nav>
            </main>
          </body>
          </html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
