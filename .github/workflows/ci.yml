name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: edufsm run examples/turnstile.fsm coin push coin
      - run: edufsm accept examples/dfa-ends-in-1.fsm 101
      - run: edufsm table examples/dfa-ends-in-1.fsm
      - run: edufsm graph examples/dfa-ends-in-1.fsm
      - run: edufsm check examples/dfa-ends-in-1.fsm
      - run: edufsm nfa-accept examples/nfa-contains-01.fsm 11010
      - run: edufsm nfa-accept examples/nfa-epsilon.fsm 1
      - run: edufsm nfa-to-dfa examples/nfa-contains-01.fsm
      - run: edufsm moore-run examples/moore-traffic-light.fsm timer timer
      - run: edufsm mealy-run examples/mealy-turnstile.fsm coin push
      - run: edufsm moore-run examples/moore-turnstile.fsm coin coin push push
      - run: edufsm mealy-run examples/mealy-turnstile.fsm coin coin push push
      - run: edufsm moore-graph examples/moore-turnstile.fsm
      - run: edufsm mealy-graph examples/mealy-turnstile.fsm
      - run: edufsm encode examples/traffic-light.fsm --style binary
      - run: edufsm encode examples/traffic-light.fsm --style one-hot
      - run: edufsm truth-table examples/traffic-light.fsm --style binary
      - run: edufsm truth-table examples/traffic-light.fsm --style one-hot
      - run: edufsm equations examples/traffic-light.fsm --style binary
      - run: edufsm equations examples/traffic-light.fsm --style one-hot
      - run: edufsm software examples/turnstile.fsm --target python-match
      - run: edufsm software examples/turnstile.fsm --target python-table
      - run: edufsm software examples/turnstile.fsm --target c-switch
      - run: edufsm run examples/uart-receiver.fsm low clock byte_complete high
      - run: edufsm run examples/command-parser.fsm letter letter space digit newline reset
      - run: edufsm run examples/protocol-controller.fsm request_start data request_end response_ready sent
      - run: edufsm run examples/protocol-controller.fsm request_start malformed reset
      - run: edufsm run examples/lexer-identifier.fsm letter digit letter

  hdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: edufsm hdl examples/turnstile.fsm --target systemverilog --module turnstile > /tmp/turnstile.sv
      - run: edufsm hdl examples/turnstile.fsm --target testbench --module turnstile > /tmp/turnstile_tb.sv
      - run: iverilog -g2012 -s turnstile_tb -o /tmp/turnstile.vvp /tmp/turnstile.sv /tmp/turnstile_tb.sv
      - run: vvp /tmp/turnstile.vvp

  web-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python scripts/generate_web_conformance.py
      - run: node tests/web_conformance.mjs
