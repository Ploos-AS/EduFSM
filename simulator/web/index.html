<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduFSM Simulator</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:1rem;line-height:1.5}textarea{width:100%;min-height:15rem;font-family:monospace}button{margin:.25rem;padding:.5rem}.state{font-size:1.5rem;font-weight:700}pre{background:#f4f4f4;padding:1rem;overflow:auto}.error{color:#a00}
</style>
</head>
<body>
<h1>EduFSM Simulator</h1>
<p>Deterministic browser frontend for EduFSM.</p>
<textarea id="source">STATE locked
STATE unlocked
INITIAL locked
locked + coin -> unlocked
unlocked + push -> locked</textarea>
<p><button id="load">Parse / Reset</button> <span id="error" class="error"></span></p>
<section><h2>Current state</h2><div id="state" class="state"></div><div id="events"></div></section>
<section><h2>State diagram</h2><div id="diagram"></div></section>
<section><h2>Transition table</h2><div id="table"></div></section>
<section><h2>Transition history</h2><pre id="history"></pre>
<button id="exportTrace">Export trace</button>
<button id="importTrace">Import / replay trace</button>
<textarea id="trace" placeholder="edufsm-trace-v1 JSON"></textarea>
</section>
<section><h2>Analysis</h2><pre id="analysis"></pre></section>
<script type="module">
import {parseFSM,nextState,outgoingEvents,reachableStates,transitionTable,traceObject,replayTrace,diagramLayout} from "./core.js";
let machine,state,history=[];
const q=id=>document.getElementById(id);
function render(){
 q("state").textContent=state||"—";
 q("history").textContent=history.map((x,i)=>`${i+1}. ${x.source} + ${x.event} -> ${x.target}`).join("\n")||"(empty)";
 const layout=diagramLayout(machine), ns="http://www.w3.org/2000/svg";
 const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${layout.width} ${layout.height}`);svg.setAttribute("role","img");
 const defs=document.createElementNS(ns,"defs");defs.innerHTML='<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"></path></marker>';svg.appendChild(defs);
 for(const e of layout.edges){const line=document.createElementNS(ns,"line");line.setAttribute("x1",e.x1);line.setAttribute("y1",e.y1);line.setAttribute("x2",e.x2);line.setAttribute("y2",e.y2);line.setAttribute("stroke","currentColor");line.setAttribute("marker-end","url(#arrow)");svg.appendChild(line);const label=document.createElementNS(ns,"text");label.setAttribute("x",(e.x1+e.x2)/2);label.setAttribute("y",(e.y1+e.y2)/2-5);label.textContent=e.event;svg.appendChild(label);}
 for(const n of layout.nodes){const circle=document.createElementNS(ns,"circle");circle.setAttribute("cx",n.x);circle.setAttribute("cy",n.y);circle.setAttribute("r","30");circle.setAttribute("fill",n.state===state?"#ddd":"white");circle.setAttribute("stroke","currentColor");circle.setAttribute("stroke-width",n.state===machine.initial?"3":"1");svg.appendChild(circle);const label=document.createElementNS(ns,"text");label.setAttribute("x",n.x);label.setAttribute("y",n.y+4);label.setAttribute("text-anchor","middle");label.textContent=n.state;svg.appendChild(label);}
 q("diagram").replaceChildren(svg);
 const table=document.createElement("table");
 table.innerHTML="<thead><tr><th>State</th><th>Event</th><th>Next state</th></tr></thead>";
 const tbody=document.createElement("tbody");
 for(const t of transitionTable(machine)){const tr=document.createElement("tr");for(const v of [t.source,t.event,t.target]){const td=document.createElement("td");td.textContent=v;tr.appendChild(td);}tbody.appendChild(tr);}
 table.appendChild(tbody);q("table").replaceChildren(table);
 q("events").replaceChildren(...outgoingEvents(machine,state).map(event=>{
   const b=document.createElement("button"); b.textContent=event;
   b.onclick=()=>{const source=state;state=nextState(machine,state,event);history.push({source,event,target:state});render();}; return b;
 }));
 const reachable=reachableStates(machine), unreachable=machine.states.filter(s=>!reachable.includes(s));
 q("analysis").textContent=`Reachable: ${reachable.join(", ")||"(none)"}\nUnreachable: ${unreachable.join(", ")||"(none)"}`;
}
function load(){
 try{machine=parseFSM(q("source").value);state=machine.initial;history=[];q("error").textContent="";render();}
 catch(e){q("error").textContent=e.message;}
}
q("load").onclick=load;
q("exportTrace").onclick=()=>{try{q("trace").value=JSON.stringify(traceObject(machine,history),null,2);}catch(e){q("error").textContent=e.message;}};
q("importTrace").onclick=()=>{try{const trace=JSON.parse(q("trace").value);const final=replayTrace(machine,trace);history=trace.steps.map(s=>({...s}));state=final;q("error").textContent="";render();}catch(e){q("error").textContent=e.message;}};
load();
</script>
</body></html>
